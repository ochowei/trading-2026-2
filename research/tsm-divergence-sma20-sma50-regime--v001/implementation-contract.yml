engine:
  control_path: src/trading_2026_2/tsm_mean_reversion_two_stage_volume_reversal_v009.py
  control_spec_constant: DEFAULT_SPEC
  cost_constant: BASE_COST
  path: src/trading_2026_2/tsm_mean_reversion_two_stage_volume_reversal_sma20_sma50_regime_v001.py
  spec_constant: DEFAULT_SPEC
  stress_cost_constant: STRESS_COST
execution:
  cooldown:
    anchor: completed-position-exit
    minimum_completed_session_steps_after_exit: 5
  decision:
    entry: next-session-open
    signal: completed-session-close
  exits:
    gap_fill: stop-gap-at-open-target-gap-at-open
    holding_exit: next-open-after-10-complete-sessions
    same_session_ambiguity: adverse-stop-first
    stop_return: '-0.04'
    target_return: '0.04'
  position_sizing:
    cash_cap: available-cash-no-borrowing
    modeled_stop_includes_entry_exit_costs: true
    risk_fraction: '0.02'
    shares: maximum-integer-shares-within-risk-and-cash-caps
fixed_parameters:
  cooldown_sessions: 5
  holding_sessions: 10
  initial_cash: '100000'
  mean_reversion_min: '0.015'
  regime_comparison: SMA20 > SMA50
  regime_includes_signal_day: true
  regime_long_sma_length: 50
  regime_short_sma_length: 20
  risk_fraction: '0.02'
  rsi_length: 2
  rsi_maximum: '50'
  sma_length: 20
  stop_return: '-0.04'
  target_return: '0.04'
  volume_average_length: 20
  volume_lead_window: 5
  volume_ratio_minimum: '1.05'
indicator_contract:
  columns:
    raw_signal: raw_signal
    regime_sma20: regime_sma20
    regime_sma50: regime_sma50
    rsi: rsi_2
    sma: sma_20
    sma20_above_sma50: sma20_above_sma50
    volume_lead: prior_volume_spike_ratio
  long_term_trend:
    accept_operator: '>'
    calendar: XNYS completed sessions
    formula: simple-moving-average
    future_data: false
    includes_signal_day_close: true
    input: auto-adjusted Close
    long_window: 50
    min_periods: 50
    not_ready: reject
    short_window: 20
  required_history_sessions: 25
  rsi:
    formula: simple-rolling-mean
    length: 2
    min_periods: 2
    not_ready: null
    zero_gain_and_loss: 50
    zero_gain_only: 0
    zero_loss_only: 100
  sma:
    lookback: 20
    min_periods: 20
    not_ready: null
  volume_lead:
    average_min_periods: 20
    enabled: true
    lead_min_periods: 5
    prior_session_window: 5
    uses_prior_sessions_only: true
    volume_average_length: 20
procedure:
  development_runner: research/tsm-divergence-sma20-sma50-regime--v001/run_development.py
  historical_evaluation_runner: research/tsm-divergence-sma20-sma50-regime--v001/run_development.py
  path: research/tsm-divergence-sma20-sma50-regime--v001/run_development.py
