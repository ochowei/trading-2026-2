  hypothesis: TSM v009 two-stage reversal 在其他規則固定時，只接受訊號日收盤 SMA(20) 嚴格高於 SMA(50) 的訊號，可檢驗長期均線狀態是否能區分較合適的短線反轉情境。Control 是完整 v009 DEFAULT_SPEC；Candidate 唯一新增訊號日 SMA(20)>SMA(50) 條件。兩條均線使用 Yahoo auto-adjusted Close 與 XNYS 已完成 session 的簡單平均，包含訊號日收盤；均線未就緒或相等即拒絕 Candidate 訊號，不讀未來資料。原短期超跌、RSI、成交量先行、收盤方向、進出場、持有、停損／停利、冷卻、風險及成本全部沿用 v009。候選、Control、條件及唯一 Trial 在看 Development 前固定；不得依 TASK-035 表現調整。 本次依 v006 明確派工將 Candidate 最長指標就緒及 fold 暖機一致固定為49個先前 XNYS sessions；Control 使用未修改 v009，最長就緒及 fold 暖機25。Development 兩臂共用2013全年暖機及2014–2018訊號／退出期間，所以不額外縮短任一臂交易期間。原 v005 準備未建立 Study、未看真實 Development 結果；改用 v002 不代表來源乾淨，既有來源及結果曝光仍依實際證據稽核。
