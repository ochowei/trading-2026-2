  hypothesis: 在 TSM 的上升趨勢中，若訊號日前五個已完成 session 的成交量先和各自下一 session 的收盤到收盤報酬配對，量能加權的五日後續報酬不低於 -0.02 且至少比同窗口未加權平均高 0.0005，這種量先價後的延遲傳導可能比單看同日量價更能篩出價格加速後仍有承接的動能；當日趨勢、均線下限、RSI、收盤方向與至少 2% 價格加速成立時，下一個 session open 進場並持有最多十個完整 session。baseline 保留五日平均單日量比與完全相同的價格、成本、風險及退出規則，只關閉跨日量—下一日報酬條件。所有規格在 Study 開始前固定；任一 formal gate 或 research target 失敗即停止 freeze，不得以結果回頭調參。
