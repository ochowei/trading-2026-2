    novelty_and_identifiability:
      development_identifiability: 事件日與訊號日有固定五個 session 間距；事件成交量參照事件日前二十個 session，事件日方向／實體由同日 OHLCV 計算，後續四日只檢查成交量和 close-to-close 上漲幅度。candidate／baseline 共用資料、價格趨勢、當日加速、成本與執行，唯一策略差異是完整固定延遲事件條件，逐筆交易可辨識此篩選器帶來的變化。
      mechanism_difference: 本候選固定配對一個特定延遲：訊號日前恰好五個已完成 session 的事件日，成交量須達此前二十日均量 1.50 倍，Close/Open 與 Close/前收皆近乎不動（絕對變動不超過 0.5%）；接著四日成交量都不超過事件量一半，期間沒有 2% 以上上漲，第五日才由動能趨勢與至少 2% 向上加速確認。這與 volume-response-lag 的 d→d+1 一日配對不同；與 volume-peak-lead 的五日視窗量峰先於報酬峰值不同，本 Study 不比較動態峰值，而固定中性事件與訊號間隔；與 volume-absorption 的高量小變動不同，本條件還要求四日量縮及延遲價格回應；與 volume-ramp、volume-lead、volume-persistence、volume-breadth、body-followthrough／sign-consistency、同日 return-alignment、gap-anchoring、range-compression、close-acceptance、efficiency 及 v024 的事件價突破均有不同的可否證條件。此為與既有近鄰相鄰但未見相同五日固定延遲、量縮和未先漲條件的明確假說，不宣稱與所有量能指標獨立。
      shared_indicator_limitations: 仍共用 TSM、XNYS、Yahoo auto_adjusted 日線 OHLCV、五日與二十日視窗、既定趨勢與價格加速。日線 OHLCV 看不到盤中主動買賣方向，「高量中性」只代表日線收盤接近開盤與前收，不代表可觀察到委託吸收或因果傳導；fixed lag 是事前選定的一個可否證延遲，不代表最優延遲。
      this_study_path: 固定 t-5 的量能比≥1.50、事件日 Open→Close 與 Close→前收絕對報酬皆≤0.5%；t-4 至 t-1 每日成交量≤事件量 50%，且期間日報酬未達 +2%；訊號日 t 保留 SMA 趨勢／RSI(2)／Close 高於前收，並需當日漲幅≥2%。baseline 僅關閉此延遲量價條件。
      v024_registered_path: v024 使用高量單一事件後五日內嚴格突破該事件的固定價格；本 Study 把訊號固定於事件後第五個 session，要求事件日中性、四日量縮、其間未先上漲，並以當日 2% 動能加速確認，不引用或突破事件日固定價格。
