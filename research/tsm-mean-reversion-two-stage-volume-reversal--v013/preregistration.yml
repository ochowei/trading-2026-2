    operator: '>='
    value: 3
fold_warmup_sessions: 25
hypothesis: 固定五個交易日的退場冷卻期，可能擋住新一輪已符合品質要求的均值回歸機會；若退場後辨識到新的放量事件，並在事件後第 1 至第 3 個交易日同時滿足收盤低於 SMA(20) 至少 1.5%、RSI(2) <= 50 且收盤高於前收，策略可能在不放寬超跌、RSI 或成交量門檻的情況下提前恢復交易，增加交易數並維持或改善成本後績效。放量事件只在上一筆交易退場後的完整日線收盤辨識，事件日不得作為價格確認日，確認後下一個 XNYS session open 進場；其他持有、停損停利、風險、成本、資料與執行規則完全沿用 v009。候選與固定的 v009 兩階段量先價行版本比較，Development 任一完整 gate 或預先登記的研究目標失敗即不凍結候選，且不在看完結果後調整規則。
initial_cash: '100000'
maximum_holding_sessions: 11
maximum_trials: 1
selection_rule:
  eligible_candidate: 唯一 Trial 必須通過全部 Development gates 與預先登記的研究目標；研究目標未通過時保留有效證據但 candidate_available=false 並終止。
  family_selection_adjustment: 完整 family 僅有預先指定的一個 Trial；Evaluation random-entry 仍須以 family size 1 完成 Bonferroni adjustment。
  method: fixed-single-candidate-no-outcome-ranking
  selected_candidate_id: tsm-mr-two-stage-cooldown-reset-v013
tie_handling:
  method: not-applicable-single-candidate
