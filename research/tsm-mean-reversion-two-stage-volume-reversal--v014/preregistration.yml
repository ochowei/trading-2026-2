  indicator_state_carried_between_folds: false
  portfolio_state_reset_each_fold: true
  replay_warmup_sessions: 25
fold_warmup_sessions: 25
hypothesis: TSM 低於近期均價時，若訊號日前第 2 至第 5 個交易日先出現成交量至少為該日前 20 個交易日均量 1.25 倍、且收盤守住當日區間上半部的放量事件，事件後在訊號日前出現至少一天收跌且成交量不超過事件量 80% 的縮量回測，期間低點不跌破事件日低點，之後訊號日收盤上漲，則即使訊號日低於 20 日均價 1.0%（含）但未達原策略 1.5% 門檻，仍可能形成扣除成本後有優勢的均值回歸機會。新增補充路徑只與 v009 原有進場路徑並存，不增加持倉數；同日若兩路徑成立，原路徑優先。這是待驗證的機制假說，不把縮量解讀為買氣充足，也不預先假定淺回測有足夠反彈空間；若研究目標或正式 Development gate 失敗，保留證據並停止 freeze，不在本 Study 調整數字或搜尋其他設定。
initial_cash: '100000'
maximum_holding_sessions: 11
maximum_trials: 1
schema_version: 1
selection_rule:
  eligible_candidate: 唯一 Trial 必須通過全部 Workflow Development gates 與全部預先登記 research_targets；任一失敗時保留有效證據、candidate_available=false 並終止，不調低門檻、不繼續搜尋。
  family_selection_adjustment: 完整 family 僅有預先指定的一個 Trial；Evaluation random-entry 若執行仍須以 family size 1 完成 Bonferroni adjustment。
  method: fixed-single-candidate-no-outcome-ranking
  selected_candidate_id: tsm-mr-two-stage-volume-reversal-retest-v014
tie_handling:
  method: not-applicable-single-candidate
