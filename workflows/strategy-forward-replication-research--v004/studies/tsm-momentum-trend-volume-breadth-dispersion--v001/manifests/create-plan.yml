    novelty_and_identifiability:
      development_identifiability: 候選與 baseline 共用同一個 warmup／Development OHLCV、同一 original breadth、價格、成本與執行；唯一差別是 candidate 額外要求訊號日前五個已完成 session 的最大原始成交量占同五日總量不超過 0.60。此比例只用 t-5 至 t-1 的 Volume，不讀訊號日或其後資料。逐筆交易、年度分布、bootstrap 與 leave-one-year-out 可檢視此限制下的樣本與壓力結果，但不能單憑摘要宣稱因果優勢。
      mechanism_difference: 原 breadth 計算五個重疊滾動量比中達標日數；新條件計算五日原始成交量最大單日占比，針對單一尖峰可能同時抬高多個重疊滾動均量這個量能集中度問題。TASK-021 path-efficiency 使用量加權收盤淨位移與缺口加日內區間路徑的比值，且其 preregistration 仍留原 breadth 敘述，故本研究不推定它取代或追加 breadth，也不重用其公式。TSM volume-lead 登記五日累積量相對二十日均量及上漲／持平成交量占比；volume-ramp 測三日單次量能脈衝；volume-peak-lead 測量峰與報酬峰的先後。這些均未測本研究明確的五日最大單日原始量占比上限。
      shared_indicator_limitations: 仍共用 TSM、XNYS、Yahoo auto_adjusted 日線 OHLCV、五日量能窗口、二十日均量、原 breadth、當日趨勢與至少 2% 價格加速；每日 OHLCV 無法判斷盤中主動買賣。新意限於原 breadth 上追加的單日成交量集中度上限，不主張資料來源首創或機制完全獨立。
      this_study_path: candidate 明確保留五日平均量比至少 1.05 與五個重疊五日量比中至少三日達 1.05，再追加 max(V[t-5:t-1]) / sum(V[t-5:t-1]) <= 0.60；baseline 完整使用原 breadth candidate，只不加此占比限制。其他價格、成本、風控、持倉與執行固定。
      v024_registered_path: 既有 v024 登記的是事件日與其後固定價突破；本 Study 不使用事件狀態、事件高點或突破價。
