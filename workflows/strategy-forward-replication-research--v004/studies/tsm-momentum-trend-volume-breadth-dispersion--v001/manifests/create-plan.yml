  hypothesis: 在保留既有五日量比至少 1.05、且五日中至少三個五日滾動量比達 1.05 的 breadth 條件後，若訊號日前五個已完成 session 的最大單日成交量不超過同五日總成交量的 60%，可排除單一極端量峰占掉五日超過五分之三、透過重疊五日均量同時推高多個 breadth 計數的情況；因此相較只用原 breadth 的 baseline，candidate 可能降低對極端單日尖峰的依賴。此 Study 明確是在原 breadth 上追加此一占比上限，不解讀 TASK-021 path-efficiency 是取代或追加 breadth，也不使用其量加權收盤路徑效率公式。Candidate 與 baseline 使用相同的價格、資料、成本、風險和執行；候選必須 evidence valid、至少 20 筆交易且涵蓋至少 3 年，並通過所有事前 formal gates 與 research targets，否則本假說不獲支持且停止凍結。
