  novelty_and_identifiability:
    development_identifiability: 指標合約明定每個量能觀測日只計算同一 session 的 Open 到 Close 是否不下跌，平盤與上漲同歸非負類別；訊號日前五個 session 的成交量先加總，再計算非負實體所占成交量比例。candidate 與 baseline 使用同一份 warmup／Development OHLCV、同一成本、持倉與價格條件，唯一策略差異是這個方向量能條件。逐筆交易、年度分布、bootstrap 與 leave-one-year-out 可檢查差異是否來自非負實體成交量占比，而不是資料、成交或事後調參。
    mechanism_difference: 本候選測的是「成交量分布在非負日內實體的比例」，只使用非負／負方向的分類，不使用日內實體幅度。它不同於 volume-lead 的 Close 對前收上漲／持平量能壓力、volume-ramp 的單次量能脈衝、volume-absorption 的高量小收盤變動、volume-efficiency 的量能加權日內區間、volume-close-acceptance 的收盤位置、volume-return-alignment 的收盤到前收報酬、volume-range-compression 的窄幅區間、volume-gap-anchoring 的隔夜缺口、volume-persistence 的首尾量能變化、volume-peak-lead 的量峰先後、volume-breadth 的高量日數、volume-response-lag 的跨日量到報酬配對、volume-body-followthrough 的量能加權實體報酬大小與 v024 的事件後固定價突破。另與既有均值回歸 v012 的單一訊號日 Close>Open 不同，本 Study 使用訊號日前五日的成交量加權方向分布，置於動能趨勢／價格加速之前；平盤納入非負類別是本次事前固定的邊界定義。
    shared_indicator_limitations: 仍共用 TSM、XNYS、Yahoo auto_adjusted OHLCV、五日視窗、二十日量能平均、當日趨勢與至少 2% 價格加速；每日 OHLCV 無法觀察盤中主動買賣方向，Close>=Open 只是日內價格結果，不等於真實買方成交，平盤也可能掩蓋盤中來回波動。因此新意是可追溯的「量能分布於非負日內實體」先行測試，不宣稱與所有既有量能指標完全獨立。
    this_study_path: 本 Study 固定訊號日前五個已完成 session，以每日日內實體 Close／Open−1 的非負／負方向建立成交量占比；非負實體成交量／五日總成交量至少為 0.60，並同時要求五日平均量比至少 1.05。當日仍須符合上升趨勢、均線下限、RSI、收盤高於前收與至少 2% 一日價格加速，下一日 open 進場並持有最多十個完整 session。baseline 保留五日平均量比與全部價格、成本、風控及退出規則，只關閉非負實體成交量占比條件。
    v024_registered_path: v024 登記的是上升趨勢中的單次放量事件，事件後五日內首次嚴格突破固定價；本候選沒有事件狀態機、事件高點或固定突破價，而是固定聚合前五個已完成 session 的日內方向成交量後，在訊號日前確認。
