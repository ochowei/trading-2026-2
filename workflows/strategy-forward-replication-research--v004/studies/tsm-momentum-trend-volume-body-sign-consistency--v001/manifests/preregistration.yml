hypothesis: 在 TSM 的上升趨勢中，若訊號日前五個已完成 XNYS session 的成交量至少有 60% 落在同日 Open 到 Close 不下跌的日內實體，這種量能方向分布先行可能比單看總量或收盤到收盤報酬更能篩出價格加速後的動能延續；平盤事前歸入非負類別。當日趨勢、均線下限、RSI、收盤方向與至少 2% 一日價格加速成立時，下一個 session open 進場並持有最多十個完整 session。baseline 保留五日平均量比與完全相同的價格、成本、風險及退出規則，只關閉非負實體成交量占比條件。所有規格在 Study 開始前固定；任一 formal gate 或 research target 失敗即停止 freeze，不得以結果回頭調參。
