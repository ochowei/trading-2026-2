  candidate_family: tsm-momentum-trend-volume-breadth-v001
  execution_is_identical: true
  family: trend-momentum-volume-breadth
  objectively_simpler_because: baseline 保留相同的趨勢、價格加速、RSI、五日平均量比、持倉、成本、風險、停損停利與冷卻規則，但關閉訊號日前五個 session 的量能參與廣度條件，因此是在同一價格路徑下不使用多日覆蓋機制的明確控制組。
  simpler_rule: 收盤符合相同趨勢、價格加速、RSI、五日平均量比與執行規則，但不要求五日先前 session 中至少三日的五日滾動量比各自達到 1.05。
