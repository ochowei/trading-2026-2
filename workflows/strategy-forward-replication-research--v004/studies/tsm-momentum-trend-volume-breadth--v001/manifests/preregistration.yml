      order: STOP_MARKET
      time_in_force: GTC
    target:
      level_from_raw_entry_open: '0.04'
      order: LIMIT
      reissued_each_open_position_session: true
      time_in_force: DAY
  novelty_and_identifiability:
    development_identifiability: 指標合約明定五日滾動量比、五日覆蓋達標日數與五日平均單日量比都只讀取訊號日前 session；candidate 與 baseline 使用同一份 warmup／Development OHLCV、同一成本、持倉與價格條件，唯一策略差異是滾動量能覆蓋廣度門檻。因此可由逐筆交易、年度分布、bootstrap 與 leave-one-year-out 診斷識別放量影響是否跨多日留下覆蓋，而不是資料、成交或事後調參造成的差異。
    mechanism_difference: 本候選測的是訊號日前五日中，至少三日的「該日結束時五日滾動平均量／此前二十日均量」各自達到 1.05；它和 volume-lead 的五日單日量比平均／上漲量占比、volume-ramp 的三日單次脈衝、volume-absorption 的高量小收盤變動、volume-efficiency 的量能加權日內區間、volume-close-acceptance 的收盤位置、volume-return-alignment 的量能報酬、volume-range-compression 的量能窄幅區間、volume-gap-anchoring 的量能缺口、volume-persistence 的端點 fade、volume-peak-lead 的峰值先後及 v024 的事件後固定價突破均不同；也不是只改版本號或把平均量比門檻改名。
    shared_indicator_limitations: 仍共用 TSM、XNYS、Yahoo auto_adjusted OHLCV、五日視窗、二十日量能平均、當日趨勢與至少 2% 價格加速；每日 OHLCV 無法觀察盤中成交主動性。因此新意是多日量比達標的覆蓋廣度，不是新資料來源，也不宣稱與所有既有量能指標完全獨立。
    this_study_path: 本 Study 固定訊號日前五個已完成 session 的平均單日量比至少為 1.05，且其中至少三個 session 的五日滾動平均量／此前二十日均量各自不低於 1.05；當日仍須符合趨勢、均線下限、RSI、收盤高於前收與至少 2% 一日價格加速，下一日 open 進場並持有最多十個完整 session。baseline 保留平均單日量比與其他全部規則，只關閉滾動量能覆蓋廣度條件。
    v024_registered_path: v024 登記的是上升趨勢中的單次放量事件，事件後五日內首次嚴格突破固定價；本候選沒有事件狀態機、事件高點或固定突破價。
