hypothesis: 在 TSM 的上升趨勢中，若訊號日前五個已完成 XNYS session 的平均單日量比至少為 1.05，且其中至少三個 session 的五日滾動平均量／此前二十日均量各自達到 1.05，這種放量影響跨多日留下的覆蓋廣度應先於價格加速；當日趨勢仍在、價格相對均線未低於固定下限、RSI 與收盤方向條件成立並出現至少 2% 一日價格加速時，下一個 session open 進場並持有最多十個完整 session，可能捕捉動能延續。它不同於既有總量壓力、單次脈衝、吸收、日內區間形狀、收盤承接、量能報酬、缺口、端點 fade、峰值先後與事件後固定突破；baseline 保留五日平均單日量比與完全相同的價格、成本、風險及退出規則，只關閉至少三日滾動覆蓋達標條件。所有規格在 Study 開始前固定；任一 formal gate 或 target 失敗即停止 freeze，不得以結果回頭調參。
