preregistration:
  baseline_definition:
    baseline_id: tsm-momentum-trend-volume-path-efficiency-baseline-v001
    candidate_family: tsm-momentum-trend-volume-path-efficiency-family-v001
    execution_is_identical: true
    family: TSM trend-momentum with five-session average volume context
    objectively_simpler_because: baseline 保留相同的五日平均量比背景、趨勢、價格加速、RSI、成本、風險及執行，只移除候選新增的成交量加權位移效率判斷。
    simpler_rule: 以五日平均單日量比至少 1.05 作為量能背景，不要求位移效率；其餘趨勢、價格及執行條件相同。
  complete_candidate_family:
    - tsm-momentum-trend-volume-path-efficiency-v001
  eligibility_rules:
    accepted_signal:
      cooldown:
        clock_anchor: completed-position-exit
        minimum_completed_session_steps_after_exit: 5
        position_must_be_flat: true
      decision_time: completed-session-close
      mean_reversion:
        close_vs_sma20_gap_minimum: '-0.10'
        close_vs_sma20_operator: '>='
        rsi_length: 2
        rsi_operator: <=
        rsi_value: '70'
        sma_length: 20
      momentum_trend:
        price_acceleration_lookback: 1
        price_acceleration_minimum: '0.02'
        price_to_sma_floor: '0.90'
        trend_sma_lag_sessions: 5
        trend_sma_ratio_floor: '0.95'
      price_direction_confirmation:
        close_above_prior_close: true
      symbol: TSM
      volume_leads_price:
        enabled: true
        prior_session_window: 5
        volume_average_length: 20
        volume_breadth_is_before_signal: true
        volume_ratio_minimum: '1.05'
        volume_ratio_operator: '>='
        volume_ratio_value: '1.05'
      volume_weighted_displacement_efficiency:
        denominator: sum(q_i * (abs(Open_i / Close_(i-1) - 1) + (High_i - Low_i) / Close_(i-1)))
        enabled: true
        lookback_sessions: 5
        minimum: '0.20'
        numerator: abs(sum(q_i * (Close_i / Close_(i-1) - 1)))
        reference_volume_average_length: 20
        uses_prior_sessions_only: true
        volume_weight: Volume_i / mean(Volume over the 20 completed sessions before i)
        zero_denominator: not_ready
    costs:
      base:
        fee_per_side_bps: '1'
        slippage_per_side_bps: '5'
      stress:
        fee_per_side_bps: '2'
        slippage_per_side_bps: '20'
