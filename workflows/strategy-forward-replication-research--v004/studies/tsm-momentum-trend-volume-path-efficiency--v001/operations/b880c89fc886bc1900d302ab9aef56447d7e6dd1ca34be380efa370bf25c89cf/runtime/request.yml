    stress_return:
      operator: '>'
      value: '0'
    traded_folds:
      operator: '>='
      value: 3
  fold_warmup_sessions: 25
  hypothesis: 在 TSM 的上升趨勢中，訊號日前五個已完成 XNYS session 的平均單日量比仍須至少為 1.05；候選改以五日成交量加權位移效率取代既有 3/5 二元量能廣度：對每個先前 session i，令 q_i=Volume_i／此前二十個完整 session 的平均 Volume，淨位移為 abs(Σ(q_i×(Close_i／Close_(i-1)-1)))，總價格路徑為 Σ(q_i×(|Open_i／Close_(i-1)-1|+(High_i-Low_i)／Close_(i-1)))，並計算淨位移／總路徑；只在該比值至少 0.20 時接受量能條件。絕對值使這個條件評估高量是否伴隨低折返的淨價格位移，不單獨指定方向；訊號方向仍由原趨勢、價格加速、RSI 與收盤方向規則決定，再於下一個 session open 進場。baseline 保留五日平均量比、相同價格條件、成本、風險及執行，但不使用位移效率條件。與原 breadth Study 的 3/5 滾動量比達標日數相比，新候選測的是成交量加權淨位移相對於總價格路徑的比例；它也不同於加權報酬減未加權報酬、加權日內區間大小、收盤位置、Open→Close 實體、隔夜缺口或量峰先後。所有指標只用訊號日前五個完成 session；新意限於這個位移效率比例與既有趨勢框架的組合，不宣稱底層 OHLCV 組件全新或具因果效果。
  initial_cash: '100000'
  maximum_holding_sessions: 11
  maximum_trials: 1
  selection_rule:
    eligible_candidate: 唯一 Trial 必須通過全部 Development gates 與已登記 research targets；未通過時不得凍結候選。
    method: fixed-single-candidate-no-outcome-ranking
    selected_candidate_id: tsm-momentum-trend-volume-path-efficiency-v001
  tie_handling:
    method: not-applicable-single-candidate
