  fold_warmup_sessions: 25
  hypothesis: TSM 處於溫和上升趨勢時，先要求訊號日前五個已完成 session 的平均量比至少為此前各日二十日均量的 1.05 倍；只有在這個先行量能背景成立後，訊號日再出現至少 0.5% 的正向開盤缺口（Open 相對前收），且當日收盤不低於開盤，才視為缺口獲得收盤接受。這個「前五日量比先行、訊號日缺口接受」組合，可能比單純趨勢及相同量比背景更能確認至少 2% 收盤加速的延續性。既有 TSM Development 卡片分別記錄過前五日量比、收盤確認、前五日負缺口承接、量能加權收盤位置及日內 Open→Close 實體，但未記錄此時間順序與正向訊號日缺口接受的組合；因此本假說只主張這個規則組合未見嘗試，並不主張量能先行、缺口或收盤確認各自首創。每日成交量是整個 session 總量，不能推論隔夜時段實際成交量。
