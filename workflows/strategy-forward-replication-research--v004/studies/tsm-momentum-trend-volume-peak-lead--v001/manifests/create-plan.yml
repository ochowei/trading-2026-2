    gate_policy: formal Development gates 與研究目標分開判定；任一 formal gate 或事前登記的新穎性識別條件失敗，都保留合法 evidence 並停止在 Development，不得看結果後調參或強行凍結候選。
    novelty_and_identifiability:
      development_identifiability: 指標合約明定量峰與收盤報酬峰都只從訊號日前五個已完成 session 計算；candidate 與 baseline 使用同一份 warmup／Development OHLCV、同一成本、持倉與執行規則，唯一策略差異是量峰是否至少早於價峰一個 session。因此可由逐筆交易、峰值位置、年度分布、bootstrap 與 leave-one-year-out 診斷量峰先行時序，而非資料、成交或事後調參造成的差異。
      mechanism_difference: 本候選不是只要求量能總量、單日脈衝或窗口首尾變化，而是要求同一個五日視窗內，最大量能相對二十日均量的 session 出現在最大正向收盤報酬之前至少一個 session；它不同於 volume-lead 的總量／上漲量壓力、volume-ramp 的單次量能脈衝、volume-absorption 的高量小收盤變動、volume-efficiency 的量能加權日內區間、volume-close-acceptance 的量能加權收盤位置、volume-return-alignment 的量能加權收盤報酬、volume-range-compression 的窄幅區間、volume-gap-anchoring 的隔夜缺口、volume-persistence 的窗口首尾鈍化，以及 v024 的事件後固定價突破。它共用單日峰值概念的一部分，但研究問題是量峰與價峰的先後次序，不是重新測單次爆量門檻。
      shared_indicator_limitations: 仍共用 TSM、XNYS、Yahoo auto_adjusted OHLCV、五日窗口、二十日量能平均、當日趨勢與至少 2% 價格加速；每日 OHLCV 無法觀察盤中成交量時序、訂單流或真正的成交主動性。因此新意是可由日線辨識的量峰先於價峰聯合狀態，不是全新資料來源，也不宣稱和所有既有量能指標完全獨立。
      this_study_path: 本 Study 固定訊號日前五個已完成 session 的量能比峰值至少為 1.20、五日平均量比至少為 1.05，且量能峰值位置至少早於同窗收盤報酬峰值一個 session；收盤報酬峰至少為 0。當日仍須符合趨勢、均線下限、RSI 與至少 2% 的一日價格加速，才於下一日 open 進場並持有最多十個完整 session。所有量價欄位都在訊號日以前固定，訊號日資料不會回頭改變峰值順序。
      v024_registered_path: v024 已登記上升趨勢中的單次放量事件，事件收盤不得高於先前五日高點，再在事件後五日內首次嚴格突破固定高點；本候選沒有事件狀態機、固定突破價或事件後等待。
    source_and_adjustment:
