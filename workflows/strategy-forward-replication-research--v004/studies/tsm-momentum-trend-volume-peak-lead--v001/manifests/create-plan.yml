  hypothesis: 在 TSM 的上升趨勢中，若訊號日前五個已完成 XNYS session 的五日平均量比至少為 1.05，且其中成交量相對此前二十日平均量的峰值至少為 1.20，該量峰至少早於同一五日視窗的收盤報酬峰值一個 session，且報酬峰至少為 0，這種「量峰先於價峰」的時序應先於動能釋放；當日趨勢仍在、價格相對均線未低於固定下限並出現至少 2% 的一日價格加速時，下一個 session open 進場並持有最多十個完整 session，可能捕捉動能延續。相較既有 volume-lead、volume-ramp、volume-absorption、volume-efficiency、volume-close-acceptance、volume-return-alignment、volume-range-compression、volume-gap-anchoring、volume-persistence 與 v024，本候選的核心是五日視窗內量能峰值與收盤報酬峰值的先後順序，而不是總量壓力、單次脈衝、高量價格背離、量能加權 OHLC 形狀、隔夜缺口、首尾鈍化或事件後突破。baseline 保留五日平均量比與完全相同的價格、成交、成本、風險與退出規則，只關閉量峰先於價峰條件。所有規格在 Study 開始前固定；任一 formal gate 失敗即否證並停止凍結，不得以結果回頭調參。
