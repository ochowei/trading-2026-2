    execution:
      cooldown:
        anchor: completed-position-exit
        minimum_completed_session_steps_after_exit: 5
      decision_time: completed-session-close
      entry: next-XNYS-open
      gap_fill: stop-gap-at-open-target-gap-at-open
      gate_policy: formal Development gates、研究 targets 與 candidate freeze qualification 分開判定；任一 formal gate 或事前登記 target 失敗，都保留合法 evidence 並停止在 Development，不得看結果後調參或強行凍結候選。
      holding_period: next-open-after-10-complete-sessions
      intrabar_ambiguity: adverse-stop-first
      position_sizing:
        cash_cap: available-cash-no-borrowing
        modeled_stop_includes_costs: true
        risk_fraction_of_pre_entry_equity: '0.02'
        shares: maximum-integer-shares-within-risk-and-cash-caps
      stop:
        level_from_raw_entry_open: '-0.04'
        order: STOP_MARKET
        time_in_force: GTC
      target:
        level_from_raw_entry_open: '0.04'
        order: LIMIT
        reissued_each_open_position_session: true
        time_in_force: DAY
    novelty_and_identifiability:
      development_identifiability: 指標合約明定每個量能觀測日只和下一個 session 的收盤到收盤報酬配對，訊號日前五個配對都已完成；candidate 與 baseline 使用同一份 warmup／Development OHLCV、同一成本、持倉與價格條件，唯一策略差異是延遲報酬傳導門檻。因此逐筆交易、年度分布、bootstrap 與 leave-one-year-out 可檢查差異是否來自量先價後機制，而不是資料、成交或事後調參。
      mechanism_difference: 本候選測的是量在 d 日出現後，d→d+1 的後續收盤報酬是否被量加權地保護且優於未加權平均；它和既有同日量能報酬對齊、量峰先於報酬峰、量能廣度、量能 ramp、吸收、日內區間效率、收盤承接、區間壓縮、缺口錨定、端點 fade 及事件後固定價突破不同。這不是改版號、改名稱或重用既有規則，而是新增明確的跨日配對方向與回應差值。
      shared_indicator_limitations: 仍共用 TSM、XNYS、Yahoo auto_adjusted OHLCV、五日視窗、二十日量能平均、當日趨勢與至少 2% 價格加速；每日 OHLCV 無法觀察盤中成交主動性，也不能把日線配對解讀成因果。因此新意是可追溯的跨日量—下一日報酬傳導測試，不宣稱與所有既有量能指標完全獨立。
      this_study_path: 本 Study 固定訊號日前五個已完成配對：每筆以 d 日成交量加權 d→d+1 收盤報酬，五日加權平均不得低於 -0.02，且至少高於同五日未加權平均 0.0005；當日仍須符合趨勢、均線下限、RSI、收盤高於前收與至少 2% 一日價格加速，下一日 open 進場並持有最多十個完整 session。baseline 保留五日平均單日量比與其他全部規則，只關閉延遲回應條件。
      v024_registered_path: v024 登記的是上升趨勢中的單次放量事件，事件後五日內首次嚴格突破固定價；本候選沒有事件狀態機、事件高點或固定突破價，而是固定把已完成量配對到下一 session 報酬。
    research_targets:
      completed_trades:
        operator: '>='
        value: 20
      stress_return:
        operator: '>'
        value: '0'
      traded_years:
        operator: '>='
        value: 3
    source_and_adjustment:
