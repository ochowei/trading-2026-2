    novelty_and_identifiability:
      development_identifiability: 指標合約明定每個量能觀測日只計算同一 session 的 Open 到 Close 實體報酬，訊號日前五個 session 都已完成；candidate 與 baseline 使用同一份 warmup／Development OHLCV、同一成本、持倉與價格條件，唯一策略差異是量能加權日內實體條件。因此逐筆交易、年度分布、bootstrap 與 leave-one-year-out 可檢查差異是否來自日內實體承接機制，而不是資料、成交或事後調參。
      mechanism_difference: 本候選測的是成交量是否集中在正向 Open 到 Close 實體，且量能加權日內實體報酬高於未加權平均；它和 volume-lead 的五日總量壓力／上漲量占比、volume-ramp 的單次脈衝、volume-absorption 的高量小收盤變動、volume-efficiency 的日內區間大小、volume-close-acceptance 的收盤位置、volume-return-alignment 的 Close 到前收報酬、volume-range-compression 的窄幅區間、volume-gap-anchoring 的隔夜缺口、volume-persistence 的首尾量能衰減、volume-peak-lead 的量峰先後、volume-breadth 的多日覆蓋、volume-response-lag 的量到下一日報酬配對及 v024 的事件後固定價突破不同。這不是改版號、改名稱或重用同一規則，而是新增 Open 到 Close 實體方向與量能加權差值。
      shared_indicator_limitations: 仍共用 TSM、XNYS、Yahoo auto_adjusted OHLCV、五日視窗、二十日量能平均、當日趨勢與至少 2% 價格加速；每日 OHLCV 無法觀察盤中成交主動性，也不能把 Open 到 Close 實體解讀成因果。因此新意是可追溯的日內實體量—價承接測試，不宣稱與所有既有量能指標完全獨立。
      this_study_path: 本 Study 固定訊號日前五個已完成 session：以每日日內實體 Close／Open−1 計算五日未加權平均與成交量加權平均；加權平均不得低於 0，且不得低於同窗口未加權實體平均。當日仍須符合趨勢、均線下限、RSI、收盤高於前收與至少 2% 一日價格加速，下一日 open 進場並持有最多十個完整 session。baseline 保留五日平均單日量比與其他全部規則，只關閉量能加權日內實體條件。
      v024_registered_path: v024 登記的是上升趨勢中的單次放量事件，事件後五日內首次嚴格突破固定價；本候選沒有事件狀態機、事件高點或固定突破價，而是固定把已完成 session 的日內實體與成交量聚合後，在訊號日前確認。
