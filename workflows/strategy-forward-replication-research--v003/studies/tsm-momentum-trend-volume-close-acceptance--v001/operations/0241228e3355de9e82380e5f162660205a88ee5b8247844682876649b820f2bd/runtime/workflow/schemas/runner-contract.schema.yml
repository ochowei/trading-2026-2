$schema: https://json-schema.org/draft/2020-12/schema
additionalProperties: false
properties:
  cases:
    items:
      additionalProperties: false
      properties:
        expect:
          enum:
            - trades
            - no-trades
        required_output_keys:
          items:
            minLength: 1
            type: string
          type: array
        rows:
          items:
            maxItems: 6
            minItems: 6
            type: array
          minItems: 1
          type: array
        stage:
          enum:
            - development
            - historical-evaluation
      required:
        - stage
        - expect
        - rows
      type: object
    minItems: 4
    type: array
  protocol:
    const: request-output-v1
  runners:
    additionalProperties: false
    properties:
      development:
        minLength: 1
        type: string
      historical-evaluation:
        minLength: 1
        type: string
    required:
      - development
      - historical-evaluation
    type: object
  synthetic_only:
    const: true
required:
  - protocol
  - synthetic_only
  - runners
  - cases
type: object
