[project]
name = "trading-2026-2"
version = "0.1.0"
description = "Python trading project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.18",
    "pandas>=2.0",
    "exchange-calendars>=4.13.2,<5",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-xdist>=3.8",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["trading_2026_2"]
