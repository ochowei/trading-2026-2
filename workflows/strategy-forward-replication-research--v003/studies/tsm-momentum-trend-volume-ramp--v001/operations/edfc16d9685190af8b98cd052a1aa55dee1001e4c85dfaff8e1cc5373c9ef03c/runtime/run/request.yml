data_digest: a42c3932a4cb825e0025f564b3dca34bd755c9173789951232e678b7250f46f7
data_path: run/bars.csv
preregistration:
  baseline_definition:
    baseline_id: tsm-momentum-trend-volume-ramp-baseline-v001
    candidate_family: tsm-momentum-trend-volume-ramp-v001
    execution_is_identical: true
    family: trend-momentum-volume-pulse
    objectively_simpler_because: 'baseline 保留相同的趨勢、價格加速、RSI、持倉、成本、風險、停損停利與冷卻

      規則，但關閉「訊號日前三個 session 的短窗量能脈衝」條件；因此它是

      同一價格路徑下不使用這個量價先行機制的明確控制組。'
    simpler_rule: '收盤高於 SMA(20)、SMA(20) 相對五個 session 前仍不下彎、價格加速至少 2%、

      RSI(2) <= 70，且符合相同執行規則；不要求三日短窗量能脈衝。'
  complete_candidate_family:
    - tsm-momentum-trend-volume-ramp-v001
  eligibility_rules:
    accepted_signal:
      cooldown:
        clock_anchor: completed-position-exit
        minimum_completed_session_steps_after_exit: 5
        position_must_be_flat: true
      decision_time: completed-session-close
      mean_reversion:
        close_vs_sma20_gap_minimum: '-0.10'
        close_vs_sma20_operator: '>='
        rsi_length: 2
        rsi_operator: <=
        rsi_value: '70'
        sma_length: 20
      momentum_trend:
        price_acceleration_lookback: 1
        price_acceleration_minimum: '0.02'
        price_to_sma_floor: '0.90'
        trend_sma_lag_sessions: 5
        trend_sma_ratio_floor: '0.95'
      price_direction_confirmation:
        close_above_prior_close: true
      symbol: TSM
      volume_leads_price:
        enabled: true
        prior_session_window: 3
        volume_average_length: 20
        volume_pulse_is_before_signal: true
        volume_ratio_minimum: '1.05'
        volume_ratio_operator: '>='
        volume_ratio_value: '1.05'
        volume_shock_is_before_signal: true
      volume_pulse:
        enabled: true
        lookback_sessions: 3
        pulse_ratio_formula: maximum_prior_volume_to_prior_20_session_average_ratio
        pulse_ratio_minimum: '1.05'
        uses_prior_sessions_only: true
    costs:
      base:
        fee_per_side_bps: '1'
        slippage_per_side_bps: '5'
      stress:
        fee_per_side_bps: '2'
        slippage_per_side_bps: '20'
    development_diagnostics:
      block_bootstrap:
        block_lengths:
          - 3
          - 5
        maximum_stress_drawdown_above_10pct_ratio: '0.10'
        minimum_stress_positive_return_ratio: '0.80'
        repetitions: 50000
        seed: 20260902
        seed_application: exact-same-seed-for-each-block-length
      leave_one_signal_year_out:
        maximum_stress_drawdown: '0.10'
        minimum_stress_profit_factor: '1.00'
        minimum_stress_return: '0'
      signal_year_breakdown: true
    development_gates:
      base_profit_factor:
        operator: '>'
        value: '1.10'
      base_return:
        operator: '>'
        value: '0'
      completed_trades:
        operator: '>='
        value: 20
      maximum_realized_trade_loss_fraction:
        operator: <=
        value: '0.04'
      maximum_stress_block_bootstrap_drawdown_above_10pct_ratio:
        operator: <=
        value: '0.10'
      maximum_stress_leave_one_year_out_drawdown:
        operator: <=
        value: '0.10'
      minimum_stress_block_bootstrap_positive_return_ratio:
        operator: '>='
        value: '0.80'
      minimum_stress_leave_one_year_out_profit_factor:
        operator: '>'
        value: '1.00'
      minimum_stress_leave_one_year_out_return:
        operator: '>'
        value: '0'
      stress_maximum_drawdown:
        operator: <=
        value: '0.10'
      stress_profit_factor:
        operator: '>'
        value: '1.00'
      stress_return:
        operator: '>'
        value: '0'
      traded_years:
        operator: '>='
        value: 3
    execution:
      cooldown:
        anchor: completed-position-exit
        minimum_completed_session_steps_after_exit: 5
      decision_time: completed-session-close
      entry: next-XNYS-open
      gap_fill: stop-gap-at-open-target-gap-at-open
      holding_period: next-open-after-10-complete-sessions
      intrabar_ambiguity: adverse-stop-first
      position_sizing:
        cash_cap: available-cash-no-borrowing
        modeled_stop_includes_costs: true
        risk_fraction_of_pre_entry_equity: '0.02'
        shares: maximum-integer-shares-within-risk-and-cash-caps
      stop:
        level_from_raw_entry_open: '-0.04'
        order: STOP_MARKET
        time_in_force: GTC
      target:
        level_from_raw_entry_open: '0.04'
        order: LIMIT
        reissued_each_open_position_session: true
        time_in_force: DAY
    gate_policy: 'formal Development gates 與研究目標分開判定；任一 formal gate 或事前登記的

      新穎性識別條件失敗，都保留合法 evidence 並停止在 Development，不得看結果後

      調參或強行凍結候選。'
    novelty_and_identifiability:
      development_identifiability: '指標合約明定短窗量能脈衝所需的成交量欄位只讀取訊號日前資料，候選與

        baseline 使用同一份 warmup／Development OHLCV、同一成本和持倉規則；因此

        可以由逐筆 raw trade、年度分布、bootstrap 與 leave-one-year-out 診斷識別

        「三日量能脈衝先行」而非資料、成交或事後調參造成的差異。'
      mechanism_difference: '候選的因果順序是「訊號日前三個 session 內出現短窗量能脈衝，再由當日價格

        加速確認」；它不是 v001 的五日分散量能壓力，也不是 v024 的單次放量事件

        加事件後固定價突破。baseline 只關閉三日量能脈衝，讓 Development 能識別這個

        時間順序條件對同一價格路徑的增量。'
      this_study_path: '本 Study 改測「三日量能先行脈衝」：訊號日前三個已完成 session 內，至少一個

        session 的成交量相對其此前二十個 session 均量至少 1.05 倍；當日只以趨勢仍在、

        均線未崩落及至少 2% 的單日價格加速觸發下一日進場。它不建立事件狀態、

        不等待事件後確認、不使用事件日高點，也沒有固定突破價。'
      v024_registered_path: 'v024 已登記「上升趨勢中的單次放量事件」，事件收盤不得高於先前五日高點，

        再在事件後五日內首次嚴格突破固定的 max(previous_five_session_high,

        event_day_high) 價位。'
    source_and_adjustment:
      adjustment_policy: Yahoo auto_adjust，OHLC 全部使用同一調整基礎。
      calendar: XNYS
      interval: 1d
      provider: yahoo
      timezone: America/New_York
  evaluation_gates:
    base_compounded_return:
      operator: '>'
      value: '0'
    base_profit_factor:
      operator: '>'
      value: '1.10'
    completed_trades:
      operator: '>='
      value: 20
    family_wise_confidence:
      operator: '>='
      value: '0.90'
    maximum_fold_positive_profit_concentration:
      operator: <=
      value: '0.50'
    maximum_fold_trade_concentration:
      operator: <=
      value: '0.50'
    maximum_realized_trade_loss_fraction:
      operator: <=
      value: '0.04'
    positive_traded_fold_ratio:
      operator: '>='
      value: '0.60'
    stress_max_drawdown:
      operator: <=
      value: '0.10'
    stress_profit_factor:
      operator: '>'
      value: '1.00'
    stress_return:
      operator: '>'
      value: '0'
    traded_folds:
      operator: '>='
      value: 3
  fold_warmup_sessions: 25
  hypothesis: '在 TSM 的上升趨勢中，若訊號日前三個已完成 XNYS session 內至少有一個量能脈衝，

    且該 session 成交量相對其此前二十個 session 均量至少 1.05 倍，這個短窗參與度

    先行訊號應先於價格加速出現；當日趨勢仍在、價格相對均線未低於事前固定下限，

    並出現至少 2% 的一日價格加速時，下一個 session open 進場並持有最多十個完整

    session，可能捕捉動能延續。相較既有 v001 的五日分散量能壓力與 v024 的單次

    放量事件加事件後五日固定價突破，本候選不建立事件狀態、不等待事件後確認、

    不使用事件日高點或固定突破價；baseline 保留完全相同的價格、成交、成本、風險

    與退出規則，只關閉三日量能脈衝。這個差異、量能只使用先前 session、以及候選／

    baseline 的共同輸入與共同執行，均在本 Study 開始前固定，故可由 Development raw

    trades 與事前登記的年度及壓力診斷識別。formal gates 或研究目標任一失敗即否證

    本假說並停止，不得以結果回頭調參。'
  initial_cash: '100000'
  maximum_holding_sessions: 11
  maximum_trials: 1
  selection_rule:
    eligible_candidate: 唯一 Trial 必須通過全部 Development gates；未通過時不得凍結候選。
    method: fixed-single-candidate-no-outcome-ranking
    selected_candidate_id: tsm-momentum-trend-volume-ramp-v001
  tie_handling:
    method: not-applicable-single-candidate
