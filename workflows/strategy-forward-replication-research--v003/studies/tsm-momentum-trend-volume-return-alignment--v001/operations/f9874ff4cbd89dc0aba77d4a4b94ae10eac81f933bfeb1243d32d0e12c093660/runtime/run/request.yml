data_digest: a42c3932a4cb825e0025f564b3dca34bd755c9173789951232e678b7250f46f7
data_path: run/bars.csv
preregistration:
  baseline_definition:
    baseline_id: tsm-momentum-trend-volume-return-alignment-baseline-v001
    candidate_family: tsm-momentum-trend-volume-return-alignment-v001
    execution_is_identical: true
    family: trend-momentum-volume-return-alignment-control
    objectively_simpler_because: baseline 保留相同的趨勢、價格加速、RSI、持倉、成本、風險、停損停利與冷卻規則，但關閉訊號日前五個 session 的量能加權收盤報酬一致性條件；因此它是同一價格路徑下不使用本量先價行機制的明確控制組。
    simpler_rule: 收盤相對 SMA(20) 不低於固定下限、SMA(20) 相對五個 session 前不下彎、價格加速至少 2%、RSI(2) <= 70，且符合相同執行規則；不要求量能加權收盤報酬一致性。
  complete_candidate_family:
    - tsm-momentum-trend-volume-return-alignment-v001
  eligibility_rules:
    accepted_signal:
      cooldown:
        clock_anchor: completed-position-exit
        minimum_completed_session_steps_after_exit: 5
        position_must_be_flat: true
      decision_time: completed-session-close
      mean_reversion:
        close_vs_sma20_gap_minimum: '-0.10'
        close_vs_sma20_operator: '>='
        rsi_length: 2
        rsi_operator: <=
        rsi_value: '70'
        sma_length: 20
      momentum_trend:
        price_acceleration_lookback: 1
        price_acceleration_minimum: '0.02'
        price_to_sma_floor: '0.90'
        trend_sma_lag_sessions: 5
        trend_sma_ratio_floor: '0.95'
      price_direction_confirmation:
        close_above_prior_close: true
      symbol: TSM
      volume_leads_price:
        enabled: false
        prior_session_window: 5
        volume_average_length: 20
        volume_ratio_minimum: '1.05'
        volume_ratio_operator: '>='
        volume_ratio_value: '1.05'
        volume_shock_is_before_signal: true
      volume_return_alignment:
        enabled: true
        lookback_sessions: 5
        prior_return_formula: close_divided_by_prior_close_minus_one
        uses_prior_sessions_only: true
        volume_return_alignment_minimum: '0.0005'
        volume_weighted_return_formula: sum(Volume*prior_return)/sum(Volume)
        volume_weighted_return_minimum: '-0.02'
    costs:
      base:
        fee_per_side_bps: '1'
        slippage_per_side_bps: '5'
      stress:
        fee_per_side_bps: '2'
        slippage_per_side_bps: '20'
    development_diagnostics:
      block_bootstrap:
        block_lengths:
          - 3
          - 5
        maximum_stress_drawdown_above_10pct_ratio: '0.10'
        minimum_stress_positive_return_ratio: '0.80'
        repetitions: 50000
        seed: 20260920
        seed_application: exact-same-seed-for-each-block-length
      leave_one_signal_year_out:
        maximum_stress_drawdown: '0.10'
        minimum_stress_profit_factor: '1.00'
        minimum_stress_return: '0'
      signal_year_breakdown: true
    development_gates:
      base_profit_factor:
        operator: '>'
        value: '1.10'
      base_return:
        operator: '>'
        value: '0'
      completed_trades:
        operator: '>='
        value: 20
      maximum_realized_trade_loss_fraction:
        operator: <=
        value: '0.04'
      maximum_stress_block_bootstrap_drawdown_above_10pct_ratio:
        operator: <=
        value: '0.10'
      maximum_stress_leave_one_year_out_drawdown:
        operator: <=
        value: '0.10'
      minimum_stress_block_bootstrap_positive_return_ratio:
        operator: '>='
        value: '0.80'
      minimum_stress_leave_one_year_out_profit_factor:
        operator: '>'
        value: '1.00'
      minimum_stress_leave_one_year_out_return:
        operator: '>'
        value: '0'
      stress_maximum_drawdown:
        operator: <=
        value: '0.10'
      stress_profit_factor:
        operator: '>'
        value: '1.00'
      stress_return:
        operator: '>'
        value: '0'
      traded_years:
        operator: '>='
        value: 3
    execution:
      cooldown:
        anchor: completed-position-exit
        minimum_completed_session_steps_after_exit: 5
      decision_time: completed-session-close
      entry: next-XNYS-open
      gap_fill: stop-gap-at-open-target-gap-at-open
      holding_period: next-open-after-10-complete-sessions
      intrabar_ambiguity: adverse-stop-first
      position_sizing:
        cash_cap: available-cash-no-borrowing
        modeled_stop_includes_costs: true
        risk_fraction_of_pre_entry_equity: '0.02'
        shares: maximum-integer-shares-within-risk-and-cash-caps
      stop:
        level_from_raw_entry_open: '-0.04'
        order: STOP_MARKET
        time_in_force: GTC
      target:
        level_from_raw_entry_open: '0.04'
        order: LIMIT
        reissued_each_open_position_session: true
        time_in_force: DAY
    gate_policy: formal Development gates 與研究目標分開判定；任一 formal gate 或事前登記的新穎性識別條件失敗，都保留合法 evidence 並停止在 Development，不得看結果後調參或強行凍結候選。
    novelty_and_identifiability:
      development_identifiability: 指標合約明定先前收盤報酬、成交量加權報酬與加權減未加權差值只讀取訊號日前資料；候選與 baseline 使用同一份 warmup／Development OHLCV、同一成本、持倉與價格觸發規則，且 baseline 只關閉本量報酬一致性條件。逐筆 raw trade、年度分布、bootstrap 與 leave-one-year-out 可用來識別本機制，而不是資料、成交或事後調參造成的差異。
      mechanism_difference: volume-lead 測五日總量集中與上漲／持平日量能占比，volume-ramp 測三日內至少一次量能脈衝，volume-absorption 測高量但收盤變動很小，volume-efficiency 測量能加權日內高低價活動，volume-close-acceptance 測量能加權收盤位置；本候選改測「成交量是否集中在正向收盤報酬較高的 session」，量的是收盤到前收的報酬歸因，不是總量、尖峰、吸收、日內區間或收盤位置。它也不同於舊 v024 的單次事件狀態與事件後固定價突破。
      this_study_path: 本 Study 在訊號日前五個已完成 session 計算 prior_return=Close/前收-1，計算 sum(Volume*prior_return)/sum(Volume)，並要求量能加權五日收盤報酬至少 0.20%，且高量日相對未加權五日平均的報酬差至少 0.05 個百分點；當日再以固定趨勢、均線下限、RSI、收紅與至少 2% 價格加速確認，下一日 open 進場。所有量報酬欄位只讀取先前 session。
      v024_registered_path: 舊 v024 已登記上升趨勢中的單次放量事件，事件後五日內首次嚴格突破 max(previous_five_session_high,event_day_high) 固定價位；本候選不建立事件狀態、不使用事件日高點，也不等待固定價突破。
    source_and_adjustment:
      adjustment_policy: Yahoo auto_adjust，OHLC 全部使用同一調整基礎。
      calendar: XNYS
      interval: 1d
      provider: yahoo
      timezone: America/New_York
  evaluation_gates:
    base_compounded_return:
      operator: '>'
      value: '0'
    base_profit_factor:
      operator: '>'
      value: '1.10'
    completed_trades:
      operator: '>='
      value: 20
    family_wise_confidence:
      operator: '>='
      value: '0.90'
    maximum_fold_positive_profit_concentration:
      operator: <=
      value: '0.50'
    maximum_fold_trade_concentration:
      operator: <=
      value: '0.50'
    maximum_realized_trade_loss_fraction:
      operator: <=
      value: '0.04'
    positive_traded_fold_ratio:
      operator: '>='
      value: '0.60'
    stress_max_drawdown:
      operator: <=
      value: '0.10'
    stress_profit_factor:
      operator: '>'
      value: '1.00'
    stress_return:
      operator: '>'
      value: '0'
    traded_folds:
      operator: '>='
      value: 3
  fold_warmup_sessions: 25
  hypothesis: 在 TSM 的上升趨勢中，若訊號日前五個已完成 XNYS session 的成交量集中在正向收盤報酬較高的日子，且量能加權五日收盤報酬至少 0.20%、量能加權報酬減未加權平均至少 0.05 個百分點，這種「量能加權收盤報酬一致性」應先於價格釋放；當日趨勢仍在、價格相對均線未低於固定下限、收盤高於前收並出現至少 2% 的一日價格加速時，下一個 session open 進場並持有最多十個完整 session，可能捕捉動能延續。這不是 volume-lead 的五日總量壓力與上漲量占比，不是 volume-ramp 的三日量能脈衝，不是 volume-absorption 的高量小收盤變動，不是 volume-efficiency 的量能加權日內區間，也不是 volume-close-acceptance 的量能加權收盤位置；同樣不建立舊 v024 的單次事件狀態或事件後固定價突破。baseline 保留完全相同的價格、成本、風險、持倉與退出規則，只關閉量能加權收盤報酬一致性。這個差異、量報酬只使用先前 session、共同輸入與共同執行均在 Study 開始前固定，故可由 Development raw trades 與事前登記診斷識別；formal gates 或研究目標任一失敗即否證本假說並停止，不得以結果回頭調參。
  initial_cash: '100000'
  maximum_holding_sessions: 11
  maximum_trials: 1
  selection_rule:
    eligible_candidate: 唯一 Trial 必須通過全部 Development gates；未通過時不得凍結候選。
    method: fixed-single-candidate-no-outcome-ranking
    selected_candidate_id: tsm-momentum-trend-volume-return-alignment-v001
  tie_handling:
    method: not-applicable-single-candidate
