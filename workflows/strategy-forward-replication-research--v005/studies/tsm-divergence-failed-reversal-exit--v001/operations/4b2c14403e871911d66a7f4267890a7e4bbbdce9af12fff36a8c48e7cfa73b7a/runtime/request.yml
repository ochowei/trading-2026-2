preregistration:
  baseline_definition:
    baseline_id: tsm-mr-supplemental-divergence-v004-control-task034-v001
    candidate_difference: Candidate 保留完整 v004 supplemental divergence 與 v009 core 訊號，只比固定 Control 多一條持倉 session Close < 接受訊號日 Low 後次一 session open market exit 規則。
    candidate_family: tsm-mean-reversion-supplemental-divergence-v004-failed-reversal-exit
    execution_is_identical: false
    family: tsm-mean-reversion-supplemental-divergence-v004-control
    objectively_simpler_because: Control 使用與 Candidate 完全相同的 v004 divergence／v009 進場及其他執行、風控設定，但不增加 signal-day Low 的失敗反轉狀態與下一開盤退出路徑。
    selection_use: 同一 Development trial 的固定 Control；只作 Candidate-minus-Control 參照，不屬候選家族、不排名。
    simpler_rule: 完整 supplemental divergence v004 加 v009 core 進場；沿用原 stop、target、10-session time exit、成本與風控；不啟用 signal-day Low 失敗反轉退出。
  complete_candidate_family:
    - tsm-mr-supplemental-divergence-v004-failed-reversal-exit
  eligibility_rules:
    accepted_signal:
      accepted_only_when_flat: true
      cooldown:
        clock_anchor: completed-position-exit
        minimum_completed_session_steps_after_exit: 5
        position_must_be_flat: true
      decision_time: completed-session-close
      indicator_contract:
        rsi_formula: simple-rolling-mean
        rsi_not_ready: null
        volume_lead_is_disabled_for_candidate: false
      mean_reversion:
        close_vs_sma20_gap_minimum: '0.015'
        close_vs_sma20_operator: '>='
        rsi_length: 2
        rsi_operator: <=
        rsi_value: '50'
        sma_length: 20
      price_direction_confirmation:
        close_above_prior_close: true
      supplemental_path:
        atr_distance_multiplier: '1.0'
        atr_lookback: 20
        bollinger_ddof: 0
        bollinger_lookback: 20
        bollinger_percent_b_max: '0.25'
        bollinger_recent_window: 5
        bollinger_standard_deviation_multiplier: '2.0'
        enabled: true
        event_reference_low_type: window_3d_low
        observation_window_sessions: 5
        pullback_low_lookback: 10
        retest_volume_lookback: 20
        volume_score_window: 3
      symbol: TSM
      volume_leads_price:
        enabled: true
        prior_session_window: 5
        volume_average_length: 20
        volume_ratio_operator: '>='
        volume_ratio_value: '1.05'
        volume_shock_is_before_signal: true
    costs:
      base:
        fee_per_side_bps: '1'
        slippage_per_side_bps: '5'
      stress:
        fee_per_side_bps: '2'
        slippage_per_side_bps: '20'
    development_diagnostics:
      attribution:
        annual_incremental_pnl: 依 signal year 分組，分別加總 validated base/stress PnL，再以 Candidate 減 Baseline。
        direction: candidate-minus-baseline
        displaced_core_trades: 僅在合法 evidence 能確認 core 訊號來源及持倉排擠關係時統計；否則標示 unavailable。
        divergence_only_trades: 僅在合法發布、驗證 evidence 提供可驗證的訊號來源欄位時統計；否則標示 unavailable。
        formal_gate_source: Active v005 支援的 Development gates；上述策略增量與逐筆 attribution 均為診斷，不是 gates。
        incremental_mdd: 分別重算 stress realized-trade-equity MDD，再以 Candidate 減 Baseline；不得解讀成相同交易路徑的因果反事實。
        net_incremental_base_stress_pnl: 分別加總 validated raw trade PnL，再以 Candidate 減 Baseline。
      average_losing_trade_loss:
        definition: 各 arm 與 base/stress cost model 分別取已驗證 Development evidence 中 pnl < 0 的交易，以損失絕對值計算算術平均；同時報告虧損筆數。
        source: 使用 evidence 逐筆 pnl 欄位；該金額已含相應 base/stress 滑價與費用，不是 formal gate。
        unavailable_rule: 若 validated evidence 不含足以重算的逐筆 pnl，明列 unavailable，不以其他資料補猜。
      block_bootstrap:
        block_lengths:
          - 3
          - 5
        repetitions: 50000
        seed: 20260902
        seed_application: exact-same-seed-for-each-block-length
      signal_year_breakdown: true
    development_gates:
      base_profit_factor:
        operator: '>'
        value: '1.10'
      base_return:
        operator: '>'
        value: '0'
      completed_trades:
        operator: '>='
        value: 20
      maximum_realized_trade_loss_fraction:
        operator: <=
        value: '0.04'
      maximum_stress_block_bootstrap_drawdown_above_10pct_ratio:
        operator: <=
        value: '0.10'
      maximum_stress_leave_one_year_out_drawdown:
        operator: <=
        value: '0.10'
      minimum_stress_block_bootstrap_positive_return_ratio:
        operator: '>='
        value: '0.80'
      minimum_stress_leave_one_year_out_profit_factor:
        operator: '>'
        value: '1.00'
      minimum_stress_leave_one_year_out_return:
        operator: '>'
        value: '0'
      stress_maximum_drawdown:
        operator: <=
        value: '0.10'
      stress_profit_factor:
        operator: '>'
        value: '1.00'
      stress_return:
        operator: '>'
        value: '0'
      traded_years:
        operator: '>='
        value: 3
    execution:
      cooldown:
        minimum_completed_session_steps_after_exit: 5
      entry: 下一個 XNYS session open，以 MARKET proposal 模擬。
      failed_reversal_exit:
        condition: 持倉 session 收盤 Close < 接受訊號日 Low（以訊號日收盤時固定的 Low 值判斷）
        decision_time: completed-session-close
        execution: 下一個 XNYS session open 以 market exit 平倉
        failed_reversal_exit_enabled: true
        same_day_order: 先判斷既有停損／停利；兩者均未觸發才安排 signal-day Low 退出
        time_exit_coincidence: 若與原 10-session 到期同在下一開盤，保留原 time exit 的優先順序、價格與持有期
      gap_fill: stop gap 以較差 open、target gap 以 open 價格改善成交，再套用成本。
      holding_exit: 既有 10 個完整持有 session 後於次一 open 到期；原規則不變。
      intrabar_ambiguity: target 與 stop 同 session 觸及時先算 stop。
      position_sizing:
        risk_fraction_of_pre_entry_equity: '0.02'
      stop:
        level_from_raw_entry_open: '-0.04'
      target:
        level_from_raw_entry_open: '0.04'
    research_targets: {}
  evaluation_gates:
    base_compounded_return:
      operator: '>'
      value: '0'
    base_profit_factor:
      operator: '>'
      value: '1.10'
    completed_trades:
      operator: '>='
      value: 20
    family_wise_confidence:
      operator: '>='
      value: '0.90'
    maximum_fold_positive_profit_concentration:
      operator: <=
      value: '0.50'
    maximum_fold_trade_concentration:
      operator: <=
      value: '0.50'
    maximum_realized_trade_loss_fraction:
      operator: <=
      value: '0.04'
    positive_traded_fold_ratio:
      operator: '>='
      value: '0.60'
    stress_max_drawdown:
      operator: <=
      value: '0.10'
    stress_profit_factor:
      operator: '>'
      value: '1.00'
    stress_return:
      operator: '>'
      value: '0'
    traded_folds:
      operator: '>='
      value: 3
  fold_warmup_sessions: 25
  hypothesis: 完整 supplemental divergence v004 與 v009 core entry、停損／停利、成本、持倉風險及 10-session 到期固定時，若任何完整持倉 session 收盤 Close < 接受訊號日 Low，於下一 XNYS session open 以 market exit 平倉，可能縮短失敗反轉的虧損持有；Candidate 相對完整 v004 Control 的差異只由唯一 Development trial 評估。
  initial_cash: '100000'
  maximum_holding_sessions: 11
  maximum_trials: 1
  selection_rule:
    eligible_candidate: 唯一候選須通過全部正式 Development gates；不依結果排名，不擴充 family。
    method: fixed-single-candidate-no-outcome-ranking
    selected_candidate_id: tsm-mr-supplemental-divergence-v004-failed-reversal-exit
  tie_handling:
    method: not-applicable-single-candidate
