  hypothesis: 在 TSM 的 SMA(20)／RSI(2) 均值回歸規則與所有既有門檻不變時，加入 selling-pressure-rollover v002 Path B，並以單一持倉 slot 讓 Path A 永遠優先；比較候選與 v009 Path A-only Control 的 Development aggregate 表現，判斷 supplemental path 是否在不取代 core 優先權下提供增量。
  initial_cash: '100000'
  maximum_holding_sessions: 11
  maximum_trials: 1
  selection_rule:
    eligible_candidate: 唯一 Trial 通過全部預先登記 Development gates 才符合資格；不以 outcome 排名。
    method: fixed-single-candidate-no-outcome-ranking
