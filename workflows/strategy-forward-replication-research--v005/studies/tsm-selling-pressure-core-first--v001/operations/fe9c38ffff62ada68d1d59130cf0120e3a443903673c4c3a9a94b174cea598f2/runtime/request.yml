    positive_traded_fold_ratio:
      operator: '>='
      value: '0.60'
    stress_max_drawdown:
      operator: <=
      value: '0.10'
    stress_profit_factor:
      operator: '>'
      value: '1.00'
    stress_return:
      operator: '>'
      value: '0'
    traded_folds:
