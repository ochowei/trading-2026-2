$schema: https://json-schema.org/draft/2020-12/schema
additionalProperties: false
properties:
  critical_drift_passed:
    type: boolean
  expected_sessions:
    items:
      pattern: ^2025-[0-9]{2}-[0-9]{2}$
      type: string
    type: array
    uniqueItems: true
  fills:
    items:
      additionalProperties: false
      properties:
        base_pnl:
          type: string
        exit_session:
          pattern: ^2025-[0-9]{2}-[0-9]{2}$
          type: string
        fill_id:
          minLength: 1
          type: string
        order_type:
          enum:
            - MARKET
            - LIMIT
            - STOP_MARKET
        proposal_actionable:
          const: false
        session:
          pattern: ^2025-[0-9]{2}-[0-9]{2}$
          type: string
        stress_pnl:
          type: string
      required:
        - fill_id
        - session
        - exit_session
        - proposal_actionable
        - order_type
        - base_pnl
        - stress_pnl
      type: object
    type: array
  initial_cash:
    pattern: ^[0-9]+(\.[0-9]+)?$
    type: string
  observed_sessions:
    items:
      pattern: ^2025-[0-9]{2}-[0-9]{2}$
      type: string
    type: array
    uniqueItems: true
  schema_version:
    const: 1
  stage:
    const: retrospective-execution-replay
  stress_drawdown_limit:
    pattern: ^(0(\.[0-9]+)?|1(\.0+)?)$
    type: string
required:
  - schema_version
  - stage
  - initial_cash
  - expected_sessions
  - observed_sessions
  - critical_drift_passed
  - stress_drawdown_limit
  - fills
type: object
