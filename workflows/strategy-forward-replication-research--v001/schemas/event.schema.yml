$schema: https://json-schema.org/draft/2020-12/schema
additionalProperties: false
properties:
  actor_id:
    minLength: 1
    type: string
  bindings:
    additionalProperties: false
    properties:
      policy_set_digest:
        format: sha256
        type: string
      source_bundle_digest:
        format: sha256
        type: string
      workflow_digest:
        format: sha256
        type: string
    required:
      - workflow_digest
      - policy_set_digest
      - source_bundle_digest
    type: object
  event_type:
    enum:
      - study-created
      - preregistration-approved
      - development-authorized
      - trial-recorded
      - trial-registry-frozen
      - provenance-audited
      - candidate-frozen
      - historical-evaluation-completed
      - robustness-challenges-completed
      - retrospective-replay-completed
      - independent-review-completed
      - evidence-unavailable
      - study-paused
      - study-resumed
      - study-terminal
  occurred_at:
    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?Z$
    type: string
  payload:
    type: object
  previous_event_digest:
    oneOf:
      - type: 'null'
      - format: sha256
        type: string
  schema_version:
    const: 1
  sequence:
    minimum: 1
    type: integer
  study_id:
    pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,127}$
    type: string
required:
  - schema_version
  - study_id
  - sequence
  - previous_event_digest
  - event_type
  - occurred_at
  - actor_id
  - bindings
  - payload
type: object
