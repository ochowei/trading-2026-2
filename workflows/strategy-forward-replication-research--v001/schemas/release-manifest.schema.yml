$schema: https://json-schema.org/draft/2020-12/schema
additionalProperties: false
properties:
  files:
    items:
      additionalProperties: false
      properties:
        digest:
          format: sha256
          type: string
        path:
          type: string
      required:
        - path
        - digest
      type: object
    minItems: 1
    type: array
  generated_at:
    minLength: 20
    type: string
  schema_version:
    const: 1
  workflow:
    const: strategy-forward-replication-research
  workflow_digest:
    format: sha256
    type: string
  workflow_version:
    const: v001
required:
  - schema_version
  - workflow
  - workflow_version
  - generated_at
  - files
  - workflow_digest
type: object
