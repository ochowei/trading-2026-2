costs:
  base:
    fee_per_side_bps: '1'
    slippage_per_side_bps: '5'
  stress:
    fee_per_side_bps: '2'
    slippage_per_side_bps: '20'
data:
  adjustment_policy: auto_adjusted
  calendar: XNYS
  interval: 1d
  provider: yahoo
  symbol: TSM
  timezone: America/New_York
execution:
  entry: next-session-open-market
  gap_fill: stop-gap-at-open-target-gap-at-open
  held_complete_sessions: 10
  intrabar_ambiguity: adverse-stop-first
  maximum_holding_session_span_for_validator: 11
  position_sizing:
    cash_cap: available-cash-no-borrowing
    modeled_stop_includes_costs: true
    risk_fraction_of_pre_entry_equity: '0.02'
    shares: maximum-integer-shares-within-risk-and-cash-caps
  stop:
    level_from_raw_entry_open: '-0.04'
    order_type: STOP_MARKET
    time_in_force: GTC
  target:
    level_from_raw_entry_open: '0.04'
    order_type: LIMIT
    reissued_each_session: true
    time_in_force: DAY
fold_policy:
  evaluation_fold_warmup_sessions: 25
  indicator_state_carried_between_folds: false
  portfolio_state_reset_each_fold: true
  replay_warmup_sessions: 25
schema_version: 1
signal:
  accepted_only_when_flat: true
  cooldown:
    clock_anchor: completed-position-exit
    completed_session_steps_after_exit: 5
  decision_time: completed-session-close
  final_signal: path-a-or-path-b-one-trade-per-signal-session
  mean_reversion:
    close_vs_sma20_gap_minimum: '0.015'
    rsi_length: 2
    rsi_maximum: '50'
    sma_length: 20
  path_a:
    source_engine_path: src/trading_2026_2/tsm_mean_reversion_two_stage_volume_reversal_v009.py
    source_semantics: base-oversold-and-prior-volume-lead-and-close-above-prior-close
    source_strategy: tsm-mean-reversion-two-stage-volume-reversal--v009
  path_b:
    base_oversold:
      close_multiplier_of_sma20: '0.985'
      close_operator: <=
      rsi_length: 2
      rsi_operator: <=
      rsi_value: '50'
    name: selling-pressure-rollover
    price_direction_confirmation: not-required
    svb3:
      current_minimum: '-0.15'
      current_operator: '>='
      formula: sum(sign(close_i_minus_prior_close_i) * volume_i, i=t-2..t) / sum(volume_i, i=t-2..t)
      prior_minimum: '-0.50'
      prior_minimum_operator: <=
      prior_window_end: t-1
      prior_window_start: t-5
  price_direction_confirmation:
    applies_to: path-a-only
    close_above_prior_close: true
  symbol: TSM
  volume_leads_price:
    enabled: true
    prior_session_window: 5
    volume_average_length: 20
    volume_ratio_minimum: '1.05'
