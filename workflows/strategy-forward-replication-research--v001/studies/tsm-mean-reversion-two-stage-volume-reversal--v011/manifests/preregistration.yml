  research_targets:
    delayed_added_post_cost_positive:
      operator: '>'
      require_both_cost_models: true
      scope: candidate_added_trades_with_delayed_confirmation_and_false_v009_same_day_signal_at_confirmation
    higher_cost_return_above_v009:
      comparison: cumulative_return_using_unrounded_pnl
      cost_model: stress
      operator: '>'
      reference_candidate_id: tsm-mr-two-stage-calibrated-volume-v009
      reference_study: tsm-mean-reversion-two-stage-volume-reversal--v009
    trade_count_above_v010:
      operator: '>'
      reference_candidate_id: tsm-mr-two-stage-calibrated-volume-v010
      reference_completed_trades: 29
      reference_study: tsm-mean-reversion-two-stage-volume-reversal--v010
  source_and_adjustment:
    adjustment_policy: Yahoo auto_adjust，OHLC 全部使用同一調整基礎。
    calendar: XNYS
    interval: 1d
    provider: yahoo
    timezone: America/New_York
