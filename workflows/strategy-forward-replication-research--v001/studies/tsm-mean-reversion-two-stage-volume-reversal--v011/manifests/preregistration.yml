hypothesis: TSM 出現具有成交量確認的短線跌深後，未來三個交易日內首次收盤回升，仍可能具有均值回歸機會。主候選把「跌深資格」與「止跌確認」拆成前後兩個階段：資格日收盤低於 20 日均線至少 1.5%、RSI(2) 不高於 50，且前五個 XNYS 交易日內符合 v009 的 1.05 倍成交量確認；保留 v009 同日收盤回升，若當日未確認則資格保留到後續第三個交易日收盤，期間第一次收盤高於前一天且仍低於當日 20 日均線時於下一交易日開盤進場。等待中的新資格不重設或延長，每次資格最多使用一次，只有空倉且已滿足五日冷卻才能建立資格；資格逾期或使用後清除。三日有效期是本輪事先指定的唯一設定，不放寬其他門檻、不搜尋有效期最佳參數。v009 作為執行規則一致的機制控制組，v010 的 Development 29 筆作為交易數比較對象；另保留 workflow 要求的簡單均值回歸 baseline。若候選交易數未嚴格超過 v010、stress 成本模型下累積報酬未嚴格高於 v009，或延後確認且不符合原 v009 同日訊號的新增交易在 base 與 stress 成本後合計損益未同時為正，即否證本輪主張。訊號、資料分段、年度邊界、資格失效後重新建立、交易衝突順序、部位大小、成本、停損停利、跳空、同日 stop/target 與十個完整交易日持有規則均在本文件固定。
initial_cash: '100000'
maximum_holding_sessions: 11
maximum_trials: 1
selection_rule:
  eligible_candidate: 唯一 Trial 必須通過全部 Development gates 與三項預先登記的 research targets；任一未通過時 candidate_available=false 並終止，不追加 Trial。
  family_selection_adjustment: 完整 family 僅有預先指定的一個 Trial；Evaluation random-entry 仍須以 family size 1 完成 Bonferroni adjustment。
  method: fixed-single-candidate-no-outcome-ranking
  selected_candidate_id: tsm-mr-two-stage-calibrated-volume-v011
tie_handling:
  method: not-applicable-single-candidate
