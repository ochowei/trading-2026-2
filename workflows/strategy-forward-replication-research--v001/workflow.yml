authority:
  actor_signatures_required: false
  git_required: false
  local_checkpoint_store_required: true
  malicious_filesystem_administrator_resistance: false
  trusted_operator_model: true
bindings:
  policy_releases:
    - path: policies/us-equity-market--v002/release.yml
      policy: us-equity-market
      version: v002
    - path: policies/canonical-execution--v001/release.yml
      policy: canonical-execution
      version: v001
    - path: policies/portfolio-risk--v001/release.yml
      policy: portfolio-risk
      version: v001
    - path: policies/paper-proposal-orders--v001/release.yml
      policy: paper-proposal-orders
      version: v001
  source_identity: source_bundle_digest
candidate_policy:
  baseline_is_outside_candidate_family: true
  changes_after_freeze_allowed: false
  maximum_candidates: 1
  objectively_simpler_baseline_required: true
  selected_candidate_must_be_in_complete_family: true
data_intervals:
  dates_are_fixed: true
  extra_sessions_allowed: false
  intervals:
    - contributes_to_performance: false
      end_date: '2013-12-31'
      role: warmup-only
      start_date: '2013-01-01'
    - end_date: '2018-12-31'
      role: development
      start_date: '2014-01-01'
      tuning_allowed: true
    - contributes_to_performance: false
      end_date: '2019-12-31'
      role: quarantine
      start_date: '2019-01-01'
    - end_date: '2024-12-31'
      folds:
        - end_date: '2020-12-31'
          start_date: '2020-01-01'
          year: 2020
        - end_date: '2021-12-31'
          start_date: '2021-01-01'
          year: 2021
        - end_date: '2022-12-31'
          start_date: '2022-01-01'
          year: 2022
        - end_date: '2023-12-31'
          start_date: '2023-01-01'
          year: 2023
        - end_date: '2024-12-31'
          start_date: '2024-01-01'
          year: 2024
      role: historical-evaluation
      start_date: '2020-01-01'
      tuning_allowed: false
    - end_date: '2025-12-31'
      role: retrospective-execution-replay
      start_date: '2025-01-01'
      tuning_allowed: false
  missing_sessions_allowed: false
  overlapping_roles_allowed: false
evidence_requirements_path: rules/evidence-requirements.yml
failure_and_recovery_path: rules/failure-and-recovery.yml
fold_policy:
  entry_cutoff_required: true
  forced_year_end_exit_allowed: false
  indicator_state_carried_between_folds: false
  maximum_holding_period_required: true
  portfolio_state_reset_each_fold: true
  warmup_can_trade: false
  warmup_uses_sessions_inside_fold_only: true
language: zh-TW
outcomes:
  fail:
    authority: none
  indeterminate:
    authority: none
  pass:
    authority: retrospectively-supported
  paused:
    terminal: false
provenance_policy:
  known-contaminated: fail
  provenance-unknown: indeterminate
  verified-clean: proceed
release:
  release_manifest_path: release-manifest.yml
  release_record_path: release.yml
  release_record_required: true
  studies_excluded_from_digest: true
safety:
  broker_access_allowed: false
  caller_reported_pass_is_authoritative: false
  network_access_during_formal_run_allowed: false
  real_orders_allowed: false
  review_can_modify_frozen_evidence: false
  reviewer_role_separation_required: false
schema_version: 1
scope:
  asset_class: us-equity
  frequency: daily
  future_performance_guaranteed: false
  live_trading_authority: false
  pass_authority: retrospectively-supported
  route: fixed-calendar-retrospective
state_machine_path: rules/state-machine.yml
storage:
  authority_checkpoint_required: true
  canonical_format: repository-canonical-yaml-v1
  event_digest_chain_required: true
  large_artifacts_external: true
  mutable_latest_pointer_allowed: false
  studies_path: studies
  study_path_pattern: studies/<study_id>
title: 策略前瞻複製研究流程
trial_policy:
  abandoned_trials_recorded: true
  append_only: true
  budget_exhausted_without_candidate: fail
  exact_input_retry_consumes_new_trial: false
  failed_trials_recorded: true
  identity_uses_exact_outcome_relevant_inputs: true
  removed_trials_recorded: true
workflow: strategy-forward-replication-research
workflow_floors_path: rules/workflow-floors.yml
workflow_version: v001
